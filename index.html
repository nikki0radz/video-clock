<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Video Clock</title>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cutive+Mono&family=Great+Vibes&display=swap');


        * {
            box-sizing: border-box;
        }


        :root {

            --text-color: #ffffff;

            --tile-color:
                rgba(0, 0, 0, 0.20);

            --clock-font:
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;

            --date-font:
                "Cutive Mono",
                monospace;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

            font-family:
                Arial,
                sans-serif;
        }



        /* =========================
           VIDEO
        ========================= */

        #videoFrame {

            position: fixed;

            top: 50%;
            left: 50%;

            width: 177.78vh;
            height: 100vh;

            min-width: 100vw;
            min-height: 56.25vw;

            transform:
                translate(-50%, -50%);

            border: 0;

            z-index: 0;

            pointer-events: none;
        }


        #shade {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.08);

            z-index: 1;

            pointer-events: none;
        }



        /* =========================
           GRID GUIDES
        ========================= */

        #gridGuides {

            position: fixed;

            inset: 0;

            z-index: 3;

            display: none;

            pointer-events: none;
        }


        body.design-mode
        #gridGuides {

            display: block;
        }


        .guide {

            position: absolute;

            background:
                rgba(255, 255, 255, 0.22);

            pointer-events: none;
        }


        .guide.vertical {

            top: 0;

            width: 1px;

            height: 100%;
        }


        .guide.horizontal {

            left: 0;

            width: 100%;

            height: 1px;
        }


        .guide.quarter-x {

            left: 25%;
        }


        .guide.center-x {

            left: 50%;

            width: 2px;

            background:
                rgba(255, 255, 255, 0.52);
        }


        .guide.three-quarter-x {

            left: 75%;
        }


        .guide.quarter-y {

            top: 25%;
        }


        .guide.center-y {

            top: 50%;

            height: 2px;

            background:
                rgba(255, 255, 255, 0.52);
        }


        .guide.three-quarter-y {

            top: 75%;
        }



        /* =========================
           CLOCK
        ========================= */

        #clockWidget {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(var(--clock-scale, 1));

            transform-origin:
                center center;

            z-index: 5;

            color:
                var(--text-color);

            pointer-events: none;

            touch-action: none;
        }


        #clock {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 1.2vw;

            font-family:
                var(--clock-font);
        }


        .digit {

            display: flex;

            align-items: center;
            justify-content: center;

            width: 10vw;
            height: 14vw;

            border-radius: 2vw;

            background:
                var(--tile-color);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            font-size: 10vw;

            font-weight: 200;

            line-height: 1;

            text-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.35);
        }



        /* =========================
           COLON
        ========================= */

        #colon {

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 1.3vw;

            margin:
                0 0.4vw;
        }


        #colon span {

            display: block;

            width: 0.9vw;
            height: 0.9vw;

            border-radius: 50%;

            background:
                var(--text-color);

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.5);
        }



        /* =========================
           SECONDS
        ========================= */

        .seconds {

            display: flex;

            align-items: center;
            justify-content: center;

            width: 4.5vw;
            height: 4.5vw;

            border-radius: 1vw;

            background:
                var(--tile-color);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            font-size: 2.6vw;

            font-weight: 200;

            line-height: 1;

            align-self: flex-end;

            margin-left: 0.2vw;
            margin-bottom: 1vw;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.35);
        }



        /* =========================
           DATE
        ========================= */

        #dateWidget {

            position: fixed;

            left: 50%;
            bottom: 18px;

            transform:
                translateX(-50%)
                scale(var(--date-scale, 1));

            transform-origin:
                center center;

            z-index: 6;

            color:
                var(--text-color);

            pointer-events: none;

            touch-action: none;
        }


        #dateDisplay {

            padding:
                0.7vw 1.5vw;

            border-radius:
                1vw;

            background:
                var(--tile-color);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            font-family:
                var(--date-font);

            font-size:
                2.2vw;

            font-weight:
                400;

            letter-spacing:
                0;

            white-space:
                nowrap;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.35);
        }


        #dateDisplay sup {

            position:
                relative;

            top:
                -0.45em;

            font-size:
                0.48em;

            line-height:
                0;

            margin-left:
                0.04em;
        }



        /* =========================
           DESIGN MODE
        ========================= */

        body.design-mode
        #clockWidget,

        body.design-mode
        #dateWidget {

            pointer-events:
                auto;

            outline:
                2px dashed
                rgba(255, 255, 255, 0.85);

            outline-offset:
                8px;

            cursor:
                move;
        }


        .resizeHandle {

            position:
                absolute;

            right:
                -20px;

            bottom:
                -20px;

            width:
                28px;

            height:
                28px;

            display:
                none;

            border-radius:
                50%;

            background:
                white;

            border:
                4px solid
                rgba(0, 0, 0, 0.7);

            cursor:
                nwse-resize;

            touch-action:
                none;

            z-index:
                20;
        }


        body.design-mode
        .resizeHandle {

            display:
                block;
        }



        /* =========================
           DESIGN BANNER
        ========================= */

        #designBanner {

            position:
                fixed;

            top:
                18px;

            left:
                50%;

            transform:
                translateX(-50%);

            z-index:
                30;

            display:
                none;

            align-items:
                center;

            gap:
                12px;

            padding:
                8px 10px
                8px 16px;

            border-radius:
                14px;

            background:
                rgba(0, 0, 0, 0.78);

            color:
                white;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);
        }


        body.design-mode
        #designBanner {

            display:
                flex;
        }


        #doneDesignButton {

            padding:
                9px 16px;

            border:
                0;

            border-radius:
                9px;

            background:
                white;

            color:
                black;

            cursor:
                pointer;
        }



        /* =========================
           SETTINGS
        ========================= */

        #settingsButton {

            position:
                fixed;

            top:
                18px;

            right:
                18px;

            z-index:
                40;

            width:
                48px;

            height:
                48px;

            border:
                0;

            border-radius:
                50%;

            background:
                rgba(0, 0, 0, 0.45);

            color:
                white;

            font-size:
                21px;

            cursor:
                pointer;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);
        }


        #settingsPanel {

            position:
                fixed;

            top:
                76px;

            right:
                18px;

            z-index:
                40;

            width:
                min(
                    380px,
                    calc(100vw - 36px)
                );

            max-height:
                calc(100vh - 100px);

            overflow-y:
                auto;

            padding:
                16px;

            display:
                none;

            gap:
                11px;

            border-radius:
                16px;

            background:
                rgba(0, 0, 0, 0.84);

            color:
                white;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }


        #settingsPanel.show {

            display:
                grid;
        }


        #youtubeInput {

            width:
                100%;

            padding:
                12px;

            border:
                0;

            border-radius:
                10px;

            font-size:
                16px;
        }


        .settingsAction {

            padding:
                12px;

            border:
                0;

            border-radius:
                10px;

            font-size:
                15px;

            cursor:
                pointer;
        }


        #loadButton {

            background:
                #ff0000;

            color:
                white;

            font-weight:
                600;
        }


        #loadButton:hover {

            background:
                #cc0000;
        }


        #designButton {

            background:
                white;

            color:
                black;
        }


        #resetLayoutButton {

            background:
                rgba(255, 255, 255, 0.12);

            color:
                white;
        }


        .settingsDivider {

            height:
                1px;

            background:
                rgba(255, 255, 255, 0.15);

            margin:
                4px 0;
        }


        .settingsTitle {

            font-size:
                12px;

            font-weight:
                bold;

            opacity:
                0.7;

            text-transform:
                uppercase;

            letter-spacing:
                0.08em;
        }


        .choiceRow {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                7px;
        }


        .fontGrid {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                7px;
        }


        .choiceButton {

            min-height:
                44px;

            padding:
                8px;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            border-radius:
                9px;

            background:
                rgba(255, 255, 255, 0.10);

            color:
                white;

            cursor:
                pointer;
        }


        .choiceButton.selected {

            border-color:
                white;

            background:
                rgba(255, 255, 255, 0.27);
        }


        .font-cutive {

            font-family:
                "Cutive Mono",
                monospace;
        }


        .font-arial {

            font-family:
                Arial,
                sans-serif;
        }


        .font-handwriting {

            font-family:
                "Caveat",
                cursive;

            font-size:
                18px;
        }


        .font-calligraphy {

            font-family:
                "Great Vibes",
                cursive;

            font-size:
                19px;
        }


        #hint {

            font-size:
                12px;

            opacity:
                0.65;
        }

    </style>

</head>



<body>


    <!-- VIDEO -->

    <iframe

        id="videoFrame"

        src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1&controls=0&loop=1&playlist=5qap5aO4i9A&modestbranding=1&rel=0"

        allow="autoplay; encrypted-media"

    ></iframe>


    <div id="shade"></div>



    <!-- GRID GUIDES -->

    <div id="gridGuides">

        <div class="guide vertical quarter-x"></div>

        <div class="guide vertical center-x"></div>

        <div class="guide vertical three-quarter-x"></div>


        <div class="guide horizontal quarter-y"></div>

        <div class="guide horizontal center-y"></div>

        <div class="guide horizontal three-quarter-y"></div>

    </div>



    <!-- CLOCK -->

    <div id="clockWidget">

        <div id="clock">

            <div class="digit" id="h1">
                0
            </div>

            <div class="digit" id="h2">
                0
            </div>


            <div id="colon">

                <span></span>
                <span></span>

            </div>


            <div class="digit" id="m1">
                0
            </div>

            <div class="digit" id="m2">
                0
            </div>


            <div
                class="seconds"
                id="seconds"
            >
                00
            </div>

        </div>


        <div
            class="resizeHandle"
            data-target="clockWidget"
        ></div>

    </div>



    <!-- DATE -->

    <div id="dateWidget">

        <div id="dateDisplay"></div>


        <div
            class="resizeHandle"
            data-target="dateWidget"
        ></div>

    </div>



    <!-- DESIGN BANNER -->

    <div id="designBanner">

        <span>
            Drag · snap to guides · resize from corner
        </span>


        <button
            id="doneDesignButton"
            type="button"
        >
            Done
        </button>

    </div>



    <!-- SETTINGS -->

    <button
        id="settingsButton"
        type="button"
    >
        ⚙
    </button>



    <div id="settingsPanel">


        <input
            id="youtubeInput"
            type="text"
            placeholder="Paste YouTube link here"
        >


        <button
            id="loadButton"
            class="settingsAction"
            type="button"
        >
            ▶ Load video
        </button>


        <div id="hint">
            Paste a normal YouTube or youtu.be link.
        </div>



        <div class="settingsDivider"></div>


        <button
            id="designButton"
            class="settingsAction"
            type="button"
        >
            ✦ Design layout
        </button>


        <button
            id="resetLayoutButton"
            class="settingsAction"
            type="button"
        >
            Reset layout
        </button>



        <div class="settingsDivider"></div>


        <div class="settingsTitle">
            Colour
        </div>


        <div class="choiceRow">

            <button
                class="choiceButton colourButton selected"
                data-colour="white"
                type="button"
            >
                White
            </button>


            <button
                class="choiceButton colourButton"
                data-colour="black"
                type="button"
            >
                Black
            </button>


            <button
                class="choiceButton colourButton"
                data-colour="warm"
                type="button"
            >
                Warm
            </button>

        </div>



        <div class="settingsDivider"></div>


        <div class="settingsTitle">
            Clock font
        </div>


        <div class="fontGrid">

            <button
                class="choiceButton clockFontButton font-cutive"
                data-font="cutive"
                type="button"
            >
                Cutive Mono
            </button>


            <button
                class="choiceButton clockFontButton font-arial selected"
                data-font="arial"
                type="button"
            >
                Arial
            </button>


            <button
                class="choiceButton clockFontButton font-handwriting"
                data-font="handwriting"
                type="button"
            >
                Handwriting
            </button>


            <button
                class="choiceButton clockFontButton font-calligraphy"
                data-font="calligraphy"
                type="button"
            >
                Calligraphy
            </button>

        </div>



        <div class="settingsTitle">
            Date font
        </div>


        <div class="fontGrid">

            <button
                class="choiceButton dateFontButton font-cutive selected"
                data-font="cutive"
                type="button"
            >
                Cutive Mono
            </button>


            <button
                class="choiceButton dateFontButton font-arial"
                data-font="arial"
                type="button"
            >
                Arial
            </button>


            <button
                class="choiceButton dateFontButton font-handwriting"
                data-font="handwriting"
                type="button"
            >
                Handwriting
            </button>


            <button
                class="choiceButton dateFontButton font-calligraphy"
                data-font="calligraphy"
                type="button"
            >
                Calligraphy
            </button>

        </div>

    </div>



    <script>


        /* =========================
           TIME + DATE
        ========================= */


        function getOrdinalSuffix(dayNumber) {

            if (
                dayNumber >= 11 &&
                dayNumber <= 13
            ) {

                return "th";

            }


            switch (
                dayNumber % 10
            ) {

                case 1:
                    return "st";

                case 2:
                    return "nd";

                case 3:
                    return "rd";

                default:
                    return "th";

            }

        }



        function updateClock() {

            const now =
                new Date();


            const hours =
                String(
                    now.getHours()
                ).padStart(
                    2,
                    "0"
                );


            const minutes =
                String(
                    now.getMinutes()
                ).padStart(
                    2,
                    "0"
                );


            const seconds =
                String(
                    now.getSeconds()
                ).padStart(
                    2,
                    "0"
                );


            document
                .getElementById("h1")
                .textContent =
                hours[0];


            document
                .getElementById("h2")
                .textContent =
                hours[1];


            document
                .getElementById("m1")
                .textContent =
                minutes[0];


            document
                .getElementById("m2")
                .textContent =
                minutes[1];


            document
                .getElementById("seconds")
                .textContent =
                seconds;



            const weekdayText =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        weekday:
                            "long"
                    }
                );


            const monthText =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        month:
                            "long"
                    }
                );


            const dayNumber =
                now.getDate();


            document
                .getElementById(
                    "dateDisplay"
                )
                .innerHTML =

                weekdayText +

                " " +

                dayNumber +

                "<sup>" +

                getOrdinalSuffix(
                    dayNumber
                ) +

                "</sup> " +

                monthText;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );



        /* =========================
           ELEMENTS
        ========================= */


        const root =
            document.documentElement;


        const clockWidget =
            document.getElementById(
                "clockWidget"
            );


        const dateWidget =
            document.getElementById(
                "dateWidget"
            );


        const settingsButton =
            document.getElementById(
                "settingsButton"
            );


        const settingsPanel =
            document.getElementById(
                "settingsPanel"
            );


        const designButton =
            document.getElementById(
                "designButton"
            );


        const doneDesignButton =
            document.getElementById(
                "doneDesignButton"
            );


        const resetLayoutButton =
            document.getElementById(
                "resetLayoutButton"
            );


        const youtubeInput =
            document.getElementById(
                "youtubeInput"
            );


        const loadButton =
            document.getElementById(
                "loadButton"
            );



        /* =========================
           YOUTUBE
        ========================= */


        function getYouTubeId(url) {

            try {

                const parsed =
                    new URL(url);


                if (
                    parsed.hostname.includes(
                        "youtu.be"
                    )
                ) {

                    return parsed
                        .pathname
                        .slice(1);

                }


                if (
                    parsed.hostname.includes(
                        "youtube.com"
                    )
                ) {

                    if (
                        parsed.pathname.startsWith(
                            "/shorts/"
                        )
                    ) {

                        return parsed
                            .pathname
                            .split("/")[2];

                    }


                    return parsed
                        .searchParams
                        .get("v");

                }


            } catch (error) {

                return null;

            }


            return null;

        }



        function loadVideo(videoId) {

            document
                .getElementById(
                    "videoFrame"
                )
                .src =

                "https://www.youtube.com/embed/" +

                videoId +

                "?autoplay=1" +

                "&mute=1" +

                "&controls=0" +

                "&loop=1" +

                "&playlist=" +

                videoId +

                "&modestbranding=1" +

                "&rel=0";

        }



        loadButton.addEventListener(
            "click",
            function () {

                const videoId =
                    getYouTubeId(
                        youtubeInput
                            .value
                            .trim()
                    );


                if (!videoId) {

                    alert(
                        "That doesn't look like a valid YouTube link."
                    );

                    return;

                }


                loadVideo(
                    videoId
                );


                settingsPanel
                    .classList
                    .remove(
                        "show"
                    );

            }
        );



        /* =========================
           SETTINGS
        ========================= */


        settingsButton.addEventListener(
            "click",
            function () {

                settingsPanel
                    .classList
                    .toggle(
                        "show"
                    );

            }
        );



        /* =========================
           DESIGN MODE
        ========================= */


        let designMode =
            false;



        function prepareForEditing(
            element
        ) {

            const rect =
                element
                    .getBoundingClientRect();


            const centreX =
                rect.left +
                rect.width / 2;


            const centreY =
                rect.top +
                rect.height / 2;


            element.style.left =
                centreX + "px";


            element.style.top =
                centreY + "px";


            element.style.right =
                "auto";


            element.style.bottom =
                "auto";


            if (
                element.id ===
                "clockWidget"
            ) {

                element.style.transform =
                    "translate(-50%, -50%) scale(var(--clock-scale, 1))";

            } else {

                element.style.transform =
                    "translate(-50%, -50%) scale(var(--date-scale, 1))";

            }

        }



        function enterDesignMode() {

            designMode =
                true;


            prepareForEditing(
                clockWidget
            );


            prepareForEditing(
                dateWidget
            );


            document
                .body
                .classList
                .add(
                    "design-mode"
                );


            settingsPanel
                .classList
                .remove(
                    "show"
                );

        }



        function exitDesignMode() {

            designMode =
                false;


            document
                .body
                .classList
                .remove(
                    "design-mode"
                );


            saveSettings();

        }



        designButton.addEventListener(
            "click",
            enterDesignMode
        );


        doneDesignButton.addEventListener(
            "click",
            exitDesignMode
        );



        /* =========================
           SNAPPING
        ========================= */


        const SNAP_DISTANCE =
            14;



        function snapValue(
            value,
            targets
        ) {

            let closest =
                value;


            let closestDistance =
                SNAP_DISTANCE + 1;


            targets.forEach(
                function (target) {

                    const distance =
                        Math.abs(
                            value -
                            target
                        );


                    if (
                        distance <
                        closestDistance
                    ) {

                        closestDistance =
                            distance;


                        closest =
                            target;

                    }

                }
            );


            if (
                closestDistance <=
                SNAP_DISTANCE
            ) {

                return closest;

            }


            return value;

        }



        /* =========================
           DRAGGING
        ========================= */


        let dragState =
            null;



        function startDrag(
            event,
            element
        ) {

            if (!designMode) {
                return;
            }


            if (
                event.target
                    .classList
                    .contains(
                        "resizeHandle"
                    )
            ) {

                return;

            }


            event.preventDefault();


            const rect =
                element
                    .getBoundingClientRect();


            dragState = {

                element:
                    element,

                offsetX:
                    event.clientX -
                    (
                        rect.left +
                        rect.width / 2
                    ),

                offsetY:
                    event.clientY -
                    (
                        rect.top +
                        rect.height / 2
                    )

            };

        }



        clockWidget.addEventListener(
            "pointerdown",
            function (event) {

                startDrag(
                    event,
                    clockWidget
                );

            }
        );


        dateWidget.addEventListener(
            "pointerdown",
            function (event) {

                startDrag(
                    event,
                    dateWidget
                );

            }
        );



        window.addEventListener(
            "pointermove",
            function (event) {

                if (!dragState) {
                    return;
                }


                event.preventDefault();


                const element =
                    dragState.element;


                const rect =
                    element
                        .getBoundingClientRect();


                const halfWidth =
                    rect.width / 2;


                const halfHeight =
                    rect.height / 2;


                let centreX =
                    event.clientX -
                    dragState.offsetX;


                let centreY =
                    event.clientY -
                    dragState.offsetY;



                /* -------------------------
                   SCREEN BOUNDARIES
                ------------------------- */


                centreX =
                    Math.max(
                        halfWidth,
                        Math.min(
                            window.innerWidth -
                            halfWidth,
                            centreX
                        )
                    );


                centreY =
                    Math.max(
                        halfHeight,
                        Math.min(
                            window.innerHeight -
                            halfHeight,
                            centreY
                        )
                    );



                /* -------------------------
                   GRID SNAP TARGETS
                ------------------------- */


                const xTargets = [

                    window.innerWidth *
                    0.25,

                    window.innerWidth *
                    0.50,

                    window.innerWidth *
                    0.75

                ];


                const yTargets = [

                    window.innerHeight *
                    0.25,

                    window.innerHeight *
                    0.50,

                    window.innerHeight *
                    0.75

                ];



                centreX =
                    snapValue(
                        centreX,
                        xTargets
                    );


                centreY =
                    snapValue(
                        centreY,
                        yTargets
                    );



                element.style.left =
                    centreX + "px";


                element.style.top =
                    centreY + "px";

            },
            {
                passive:
                    false
            }
        );



        window.addEventListener(
            "pointerup",
            function () {

                if (
                    dragState
                ) {

                    dragState =
                        null;


                    saveSettings();

                }

            }
        );



        /* =========================
           RESIZING
        ========================= */


        let resizeState =
            null;



        function getScale(
            element
        ) {

            const property =

                element.id ===
                "clockWidget"

                ? "--clock-scale"

                : "--date-scale";


            return (

                parseFloat(

                    getComputedStyle(
                        element
                    )
                    .getPropertyValue(
                        property
                    )

                ) || 1

            );

        }



        document
            .querySelectorAll(
                ".resizeHandle"
            )
            .forEach(
                function (handle) {

                    handle.addEventListener(
                        "pointerdown",
                        function (event) {

                            if (!designMode) {
                                return;
                            }


                            event.preventDefault();

                            event.stopPropagation();


                            const target =
                                document
                                    .getElementById(
                                        handle
                                            .dataset
                                            .target
                                    );


                            resizeState = {

                                target:
                                    target,

                                startX:
                                    event.clientX,

                                startScale:
                                    getScale(
                                        target
                                    )

                            };

                        }
                    );

                }
            );



        window.addEventListener(
            "pointermove",
            function (event) {

                if (!resizeState) {
                    return;
                }


                event.preventDefault();


                const difference =
                    event.clientX -
                    resizeState.startX;


                let scale =
                    resizeState.startScale +
                    difference / 300;


                scale =
                    Math.max(
                        0.30,
                        Math.min(
                            3,
                            scale
                        )
                    );


                if (
                    resizeState
                        .target
                        .id ===
                    "clockWidget"
                ) {

                    resizeState
                        .target
                        .style
                        .setProperty(
                            "--clock-scale",
                            scale
                        );

                } else {

                    resizeState
                        .target
                        .style
                        .setProperty(
                            "--date-scale",
                            scale
                        );

                }

            },
            {
                passive:
                    false
            }
        );



        window.addEventListener(
            "pointerup",
            function () {

                if (
                    resizeState
                ) {

                    resizeState =
                        null;


                    saveSettings();

                }

            }
        );



        /* =========================
           COLOURS
        ========================= */


        const colourOptions = {

            white: {

                text:
                    "#ffffff",

                tile:
                    "rgba(0,0,0,0.20)"

            },


            black: {

                text:
                    "#111111",

                tile:
                    "rgba(255,255,255,0.28)"

            },


            warm: {

                text:
                    "#fff1d6",

                tile:
                    "rgba(45,30,15,0.28)"

            }

        };



        let selectedColour =
            "white";



        function applyColour(
            name
        ) {

            const option =
                colourOptions[name];


            if (!option) {
                return;
            }


            selectedColour =
                name;


            root.style.setProperty(
                "--text-color",
                option.text
            );


            root.style.setProperty(
                "--tile-color",
                option.tile
            );


            document
                .querySelectorAll(
                    ".colourButton"
                )
                .forEach(
                    function (button) {

                        button
                            .classList
                            .toggle(
                                "selected",
                                button
                                    .dataset
                                    .colour ===
                                name
                            );

                    }
                );


            saveSettings();

        }



        document
            .querySelectorAll(
                ".colourButton"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            applyColour(
                                button
                                    .dataset
                                    .colour
                            );

                        }
                    );

                }
            );



        /* =========================
           FONTS
        ========================= */


        const fonts = {

            cutive:
                '"Cutive Mono", monospace',

            arial:
                'Arial, sans-serif',

            handwriting:
                '"Caveat", cursive',

            calligraphy:
                '"Great Vibes", cursive'

        };



        let selectedClockFont =
            "arial";


        let selectedDateFont =
            "cutive";



        function applyClockFont(
            name
        ) {

            selectedClockFont =
                name;


            root.style.setProperty(
                "--clock-font",
                fonts[name]
            );


            document
                .querySelectorAll(
                    ".clockFontButton"
                )
                .forEach(
                    function (button) {

                        button
                            .classList
                            .toggle(
                                "selected",
                                button
                                    .dataset
                                    .font ===
                                name
                            );

                    }
                );


            saveSettings();

        }



        function applyDateFont(
            name
        ) {

            selectedDateFont =
                name;


            root.style.setProperty(
                "--date-font",
                fonts[name]
            );


            document
                .querySelectorAll(
                    ".dateFontButton"
                )
                .forEach(
                    function (button) {

                        button
                            .classList
                            .toggle(
                                "selected",
                                button
                                    .dataset
                                    .font ===
                                name
                            );

                    }
                );


            saveSettings();

        }



        document
            .querySelectorAll(
                ".clockFontButton"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            applyClockFont(
                                button
                                    .dataset
                                    .font
                            );

                        }
                    );

                }
            );



        document
            .querySelectorAll(
                ".dateFontButton"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            applyDateFont(
                                button
                                    .dataset
                                    .font
                            );

                        }
                    );

                }
            );



        /* =========================
           SAVE SETTINGS
        ========================= */


        function saveSettings() {

            const settings = {

                clockLeft:
                    clockWidget.style.left,

                clockTop:
                    clockWidget.style.top,

                clockScale:
                    getScale(
                        clockWidget
                    ),

                dateLeft:
                    dateWidget.style.left,

                dateTop:
                    dateWidget.style.top,

                dateScale:
                    getScale(
                        dateWidget
                    ),

                colour:
                    selectedColour,

                clockFont:
                    selectedClockFont,

                dateFont:
                    selectedDateFont

            };


            localStorage.setItem(
                "videoClockSettings",
                JSON.stringify(
                    settings
                )
            );

        }



        function loadSettings() {

            const saved =
                localStorage.getItem(
                    "videoClockSettings"
                );


            if (!saved) {
                return;
            }


            try {

                const settings =
                    JSON.parse(
                        saved
                    );


                if (
                    settings.clockLeft &&
                    settings.clockTop
                ) {

                    clockWidget.style.left =
                        settings.clockLeft;


                    clockWidget.style.top =
                        settings.clockTop;


                    clockWidget.style.bottom =
                        "auto";


                    clockWidget.style.transform =
                        "translate(-50%, -50%) scale(var(--clock-scale, 1))";

                }


                if (
                    settings.dateLeft &&
                    settings.dateTop
                ) {

                    dateWidget.style.left =
                        settings.dateLeft;


                    dateWidget.style.top =
                        settings.dateTop;


                    dateWidget.style.bottom =
                        "auto";


                    dateWidget.style.transform =
                        "translate(-50%, -50%) scale(var(--date-scale, 1))";

                }


                clockWidget
                    .style
                    .setProperty(
                        "--clock-scale",
                        settings.clockScale || 1
                    );


                dateWidget
                    .style
                    .setProperty(
                        "--date-scale",
                        settings.dateScale || 1
                    );


                applyColour(
                    settings.colour ||
                    "white"
                );


                applyClockFont(
                    settings.clockFont ||
                    "arial"
                );


                applyDateFont(
                    settings.dateFont ||
                    "cutive"
                );


            } catch (error) {

                console.log(
                    "Saved settings could not be loaded."
                );

            }

        }



        /* =========================
           RESET
        ========================= */


        resetLayoutButton.addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "videoClockSettings"
                );


                location.reload();

            }
        );



        /* =========================
           START
        ========================= */


        loadSettings();


    </script>


</body>

</html>
