<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Video Clock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #videoFrame {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 177.78vh;
      height: 100vh;
      min-width: 100vw;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: 0;
      z-index: 0;
      pointer-events: none;
    }

    #shade {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      z-index: 1;
      pointer-events: none;
    }

    #clockContainer {
      position: fixed;
      inset: 0;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: white;
      text-align: center;
      pointer-events: none;

      text-shadow:
        0 0 12px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(0, 0, 0, 0.75);
    }

    #time {
      font-size: 15vw;
      font-weight: 300;
      letter-spacing: 0.03em;
    }

    #date {
      margin-top: 8px;
      font-size: 3vw;
      font-weight: 300;
    }

    #settingsButton {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 4;

      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-size: 22px;
      cursor: pointer;

      backdrop-filter: blur(10px);
    }

    #settingsPanel {
      position: fixed;
      top: 76px;
      right: 18px;
      z-index: 4;

      width: min(360px, calc(100vw - 36px));
      padding: 16px;

      display: none;
      gap: 10px;

      background: rgba(0, 0, 0, 0.72);
      color: white;
      border-radius: 16px;

      backdrop-filter: blur(14px);
    }

    #settingsPanel.show {
      display: grid;
    }

    #youtubeInput {
      width: 100%;
      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-size: 16px;
    }

    #loadButton {
      padding: 12px;

      border: 0;
      border-radius: 10px;

      font-size: 16px;
      cursor: pointer;
    }

    #hint {
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <iframe
    id="videoFrame"
    src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1&controls=0&loop=1&playlist=5qap5aO4i9A&modestbranding=1&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

  <div id="shade"></div>

  <div id="clockContainer">
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <button id="settingsButton">⚙️</button>

  <div id="settingsPanel">
    <input
      id="youtubeInput"
      type="text"
      placeholder="Paste YouTube link here">

    <button id="loadButton">Load video</button>

    <div id="hint">
      Paste a normal YouTube link or youtu.be link.
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      const date = now.toLocaleDateString([], {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

      document.getElementById("time").textContent = time;
      document.getElementById("date").textContent = date;
    }

    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);

        if (parsed.hostname.includes("youtu.be")) {
          return parsed.pathname.slice(1);
        }

        if (parsed.hostname.includes("youtube.com")) {
          return parsed.searchParams.get("v");
        }
      } catch (error) {
        return null;
      }

      return null;
    }

    function loadVideo(videoId) {
      const embedUrl =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1" +
        "&mute=1" +
        "&controls=0" +
        "&loop=1" +
        "&playlist=" + videoId +
        "&modestbranding=1" +
        "&rel=0";

      document.getElementById("videoFrame").src = embedUrl;
    }

    const settingsButton = document.getElementById("settingsButton");
    const settingsPanel = document.getElementById("settingsPanel");
    const loadButton = document.getElementById("loadButton");
    const youtubeInput = document.getElementById("youtubeInput");

    settingsButton.addEventListener("click", function () {
      settingsPanel.classList.toggle("show");
    });

    loadButton.addEventListener("click", function () {
      const videoId = getYouTubeId(youtubeInput.value.trim());

      if (!videoId) {
        alert("That doesn't look like a valid YouTube link.");
        return;
      }

      loadVideo(videoId);
      settingsPanel.classList.remove("show");
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
