<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Video Clock</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: black;

            font-family:
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;
        }


        /* ==============================
           VIDEO
        ============================== */

        #videoFrame {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 177.78vh;
            height: 100vh;

            min-width: 100vw;
            min-height: 56.25vw;

            transform: translate(-50%, -50%);

            border: 0;

            z-index: 0;

            pointer-events: none;
        }


        #shade {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.08);

            z-index: 1;

            pointer-events: none;
        }


        /* ==============================
           CLOCK WIDGET
        ============================== */

        #clockWidget {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(var(--clock-scale, 1));

            transform-origin: center center;

            z-index: 2;

            color: white;

            pointer-events: none;

            touch-action: none;
        }


        #clock {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 1.2vw;
        }


        .digit {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 10vw;
            height: 14vw;

            border-radius: 2vw;

            background: rgba(0, 0, 0, 0.20);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            font-size: 10vw;

            font-weight: 200;

            line-height: 1;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.35);
        }


        /* ==============================
           COLON
        ============================== */

        #colon {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 1.3vw;

            margin: 0 0.4vw;
        }


        #colon span {
            display: block;

            width: 0.9vw;
            height: 0.9vw;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.6);
        }


        /* ==============================
           SECONDS
        ============================== */

        .seconds {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 4.5vw;
            height: 4.5vw;

            border-radius: 1vw;

            background: rgba(0, 0, 0, 0.20);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            font-size: 2.6vw;

            font-weight: 200;

            line-height: 1;

            align-self: flex-end;

            margin-left: 0.2vw;
            margin-bottom: 1vw;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35);
        }


        /* ==============================
           DATE
        ============================== */

        #dateWidget {
            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%)
                scale(var(--date-scale, 1));

            transform-origin: center center;

            z-index: 3;

            color: white;

            pointer-events: none;

            touch-action: none;
        }


        #dateDisplay {
            padding: 0.7vw 1.5vw;

            border-radius: 1vw;

            background: rgba(0, 0, 0, 0.20);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            font-family:
                "Cutive Mono",
                monospace;

            font-size: 2.2vw;

            font-weight: 400;

            letter-spacing: 0;

            white-space: nowrap;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.35);
        }


        #dateDisplay sup {
            position: relative;

            top: -0.45em;

            font-size: 0.48em;

            line-height: 0;

            margin-left: 0.04em;
        }


        /* ==============================
           DESIGN MODE
        ============================== */

        body.design-mode #clockWidget,
        body.design-mode #dateWidget {
            pointer-events: auto;

            outline:
                2px dashed
                rgba(255, 255, 255, 0.8);

            outline-offset: 8px;

            cursor: move;
        }


        .resizeHandle {
            position: absolute;

            display: none;

            width: 26px;
            height: 26px;

            right: -20px;
            bottom: -20px;

            border-radius: 50%;

            background: white;

            border:
                4px solid
                rgba(0, 0, 0, 0.65);

            cursor: nwse-resize;

            touch-action: none;

            z-index: 20;
        }


        body.design-mode .resizeHandle {
            display: block;
        }


        #designBanner {
            position: fixed;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: none;

            align-items: center;

            gap: 12px;

            padding: 8px 10px 8px 16px;

            border-radius: 14px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }


        body.design-mode #designBanner {
            display: flex;
        }


        #designBannerText {
            font-size: 14px;
        }


        #doneDesignButton {
            padding: 9px 16px;

            border: 0;

            border-radius: 9px;

            background: white;

            color: black;

            font-size: 14px;

            cursor: pointer;
        }


        /* ==============================
           SETTINGS
        ============================== */

        #settingsButton {
            position: fixed;

            top: 18px;
            right: 18px;

            z-index: 20;

            width: 48px;
            height: 48px;

            border: 0;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.35);

            color: white;

            font-size: 21px;

            cursor: pointer;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }


        #settingsPanel {
            position: fixed;

            top: 76px;
            right: 18px;

            z-index: 20;

            width:
                min(
                    360px,
                    calc(100vw - 36px)
                );

            padding: 16px;

            display: none;

            gap: 10px;

            background: rgba(0, 0, 0, 0.78);

            color: white;

            border-radius: 16px;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }


        #settingsPanel.show {
            display: grid;
        }


        #youtubeInput {
            width: 100%;

            padding: 12px;

            border: 0;

            border-radius: 10px;

            font-size: 16px;
        }


        .settingsAction {
            padding: 12px;

            border: 0;

            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;
        }


        #designButton {
            margin-top: 5px;
        }


        #resetLayoutButton {
            background:
                rgba(255, 255, 255, 0.12);

            color: white;
        }


        #hint {
            font-size: 13px;

            opacity: 0.7;
        }


        .settingsDivider {
            height: 1px;

            margin: 5px 0;

            background:
                rgba(255, 255, 255, 0.15);
        }

    </style>
</head>


<body>


    <!-- VIDEO -->

    <iframe
        id="videoFrame"
        src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1&controls=0&loop=1&playlist=5qap5aO4i9A&modestbranding=1&rel=0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>


    <div id="shade"></div>



    <!-- CLOCK -->

    <div id="clockWidget">

        <div id="clock">

            <div class="digit" id="h1">0</div>

            <div class="digit" id="h2">0</div>


            <div id="colon">
                <span></span>
                <span></span>
            </div>


            <div class="digit" id="m1">0</div>

            <div class="digit" id="m2">0</div>


            <div class="seconds" id="seconds">
                00
            </div>

        </div>


        <div
            class="resizeHandle"
            data-target="clockWidget"
        ></div>

    </div>



    <!-- DATE -->

    <div id="dateWidget">

        <div id="dateDisplay"></div>

        <div
            class="resizeHandle"
            data-target="dateWidget"
        ></div>

    </div>



    <!-- DESIGN MODE BANNER -->

    <div id="designBanner">

        <div id="designBannerText">
            Drag to move · corner dot to resize
        </div>

        <button
            id="doneDesignButton"
            type="button"
        >
            Done
        </button>

    </div>



    <!-- SETTINGS -->

    <button
        id="settingsButton"
        type="button"
    >
        ⚙
    </button>


    <div id="settingsPanel">

        <input
            id="youtubeInput"
            type="text"
            placeholder="Paste YouTube link here"
        >

        <button
            id="loadButton"
            class="settingsAction"
            type="button"
        >
            Load video
        </button>


        <div id="hint">
            Paste a normal YouTube or youtu.be link.
        </div>


        <div class="settingsDivider"></div>


        <button
            id="designButton"
            class="settingsAction"
            type="button"
        >
            ✦ Design layout
        </button>


        <button
            id="resetLayoutButton"
            class="settingsAction"
            type="button"
        >
            Reset layout
        </button>

    </div>



    <script>

        /* ==================================
           DATE / TIME
        ================================== */

        function getOrdinalSuffix(dayNumber) {

            if (
                dayNumber >= 11 &&
                dayNumber <= 13
            ) {
                return "th";
            }


            switch (dayNumber % 10) {

                case 1:
                    return "st";

                case 2:
                    return "nd";

                case 3:
                    return "rd";

                default:
                    return "th";
            }
        }



        function updateClock() {

            const now =
                new Date();


            const hours =
                String(
                    now.getHours()
                ).padStart(
                    2,
                    "0"
                );


            const minutes =
                String(
                    now.getMinutes()
                ).padStart(
                    2,
                    "0"
                );


            const seconds =
                String(
                    now.getSeconds()
                ).padStart(
                    2,
                    "0"
                );


            document
                .getElementById("h1")
                .textContent =
                hours[0];


            document
                .getElementById("h2")
                .textContent =
                hours[1];


            document
                .getElementById("m1")
                .textContent =
                minutes[0];


            document
                .getElementById("m2")
                .textContent =
                minutes[1];


            document
                .getElementById("seconds")
                .textContent =
                seconds;



            const weekdayText =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "long"
                    }
                );


            const monthText =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        month: "long"
                    }
                );


            const dayNumber =
                now.getDate();


            const ordinalSuffix =
                getOrdinalSuffix(
                    dayNumber
                );


            document
                .getElementById(
                    "dateDisplay"
                )
                .innerHTML =

                weekdayText +

                " " +

                dayNumber +

                "<sup>" +

                ordinalSuffix +

                "</sup> " +

                monthText;

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );



        /* ==================================
           YOUTUBE
        ================================== */

        function getYouTubeId(url) {

            try {

                const parsed =
                    new URL(url);


                if (
                    parsed.hostname.includes(
                        "youtu.be"
                    )
                ) {

                    return parsed
                        .pathname
                        .slice(1);

                }


                if (
                    parsed.hostname.includes(
                        "youtube.com"
                    )
                ) {

                    if (
                        parsed.pathname.startsWith(
                            "/shorts/"
                        )
                    ) {

                        return parsed
                            .pathname
                            .split("/")[2];

                    }


                    return parsed
                        .searchParams
                        .get("v");

                }


            } catch (error) {

                return null;

            }


            return null;

        }



        function loadVideo(videoId) {

            const embedUrl =

                "https://www.youtube.com/embed/" +

                videoId +

                "?autoplay=1" +

                "&mute=1" +

                "&controls=0" +

                "&loop=1" +

                "&playlist=" +

                videoId +

                "&modestbranding=1" +

                "&rel=0";


            document
                .getElementById(
                    "videoFrame"
                )
                .src =
                embedUrl;

        }



        /* ==================================
           SETTINGS
        ================================== */

        const settingsButton =
            document.getElementById(
                "settingsButton"
            );


        const settingsPanel =
            document.getElementById(
                "settingsPanel"
            );


        const loadButton =
            document.getElementById(
                "loadButton"
            );


        const youtubeInput =
            document.getElementById(
                "youtubeInput"
            );


        const designButton =
            document.getElementById(
                "designButton"
            );


        const doneDesignButton =
            document.getElementById(
                "doneDesignButton"
            );


        const resetLayoutButton =
            document.getElementById(
                "resetLayoutButton"
            );



        settingsButton.addEventListener(
            "click",
            function () {

                settingsPanel
                    .classList
                    .toggle("show");

            }
        );



        loadButton.addEventListener(
            "click",
            function () {

                const videoId =
                    getYouTubeId(
                        youtubeInput
                            .value
                            .trim()
                    );


                if (!videoId) {

                    alert(
                        "That doesn't look like a valid YouTube link."
                    );

                    return;

                }


                loadVideo(
                    videoId
                );


                settingsPanel
                    .classList
                    .remove("show");

            }
        );



        /* ==================================
           DESIGN MODE
        ================================== */

        let designMode =
            false;


        function enterDesignMode() {

            designMode =
                true;


            document
                .body
                .classList
                .add(
                    "design-mode"
                );


            settingsPanel
                .classList
                .remove("show");


            convertToPixelPosition(
                document.getElementById(
                    "clockWidget"
                )
            );


            convertToPixelPosition(
                document.getElementById(
                    "dateWidget"
                )
            );

        }



        function exitDesignMode() {

            designMode =
                false;


            document
                .body
                .classList
                .remove(
                    "design-mode"
                );


            saveLayout();

        }



        designButton.addEventListener(
            "click",
            enterDesignMode
        );


        doneDesignButton.addEventListener(
            "click",
            exitDesignMode
        );



        /* ==================================
           POSITION CONVERSION
        ================================== */

        function convertToPixelPosition(
            element
        ) {

            if (
                element.dataset.positioned ===
                "true"
            ) {
                return;
            }


            const rect =
                element
                    .getBoundingClientRect();


            element.style.left =
                rect.left + "px";


            element.style.top =
                rect.top + "px";


            element.style.right =
                "auto";


            element.style.bottom =
                "auto";


            if (
                element.id ===
                "clockWidget"
            ) {

                element.style.transform =
                    "scale(var(--clock-scale, 1))";

            } else {

                element.style.transform =
                    "scale(var(--date-scale, 1))";

            }


            element.dataset.positioned =
                "true";

        }



        /* ==================================
           DRAGGING
        ================================== */

        let dragState =
            null;


        function beginDrag(
            event,
            element
        ) {

            if (!designMode) {
                return;
            }


            if (
                event.target.classList
                    .contains(
                        "resizeHandle"
                    )
            ) {
                return;
            }


            event.preventDefault();


            const rect =
                element
                    .getBoundingClientRect();


            dragState = {

                element:
                    element,

                pointerId:
                    event.pointerId,

                offsetX:
                    event.clientX -
                    rect.left,

                offsetY:
                    event.clientY -
                    rect.top

            };


            element.setPointerCapture(
                event.pointerId
            );

        }



        function moveDrag(event) {

            if (!dragState) {
                return;
            }


            const element =
                dragState.element;


            const rect =
                element
                    .getBoundingClientRect();


            let left =
                event.clientX -
                dragState.offsetX;


            let top =
                event.clientY -
                dragState.offsetY;


            const maxLeft =
                window.innerWidth -
                rect.width;


            const maxTop =
                window.innerHeight -
                rect.height;


            left =
                Math.max(
                    0,
                    Math.min(
                        maxLeft,
                        left
                    )
                );


            top =
                Math.max(
                    0,
                    Math.min(
                        maxTop,
                        top
                    )
                );


            element.style.left =
                left + "px";


            element.style.top =
                top + "px";

        }



        function endDrag(event) {

            if (!dragState) {
                return;
            }


            try {

                dragState
                    .element
                    .releasePointerCapture(
                        dragState.pointerId
                    );

            } catch (error) {
            }


            dragState =
                null;


            saveLayout();

        }



        const clockWidget =
            document.getElementById(
                "clockWidget"
            );


        const dateWidget =
            document.getElementById(
                "dateWidget"
            );



        clockWidget.addEventListener(
            "pointerdown",
            function (event) {

                beginDrag(
                    event,
                    clockWidget
                );

            }
        );


        dateWidget.addEventListener(
            "pointerdown",
            function (event) {

                beginDrag(
                    event,
                    dateWidget
                );

            }
        );


        window.addEventListener(
            "pointermove",
            moveDrag
        );


        window.addEventListener(
            "pointerup",
            endDrag
        );


        window.addEventListener(
            "pointercancel",
            endDrag
        );



        /* ==================================
           RESIZING
        ================================== */

        let resizeState =
            null;



        document
            .querySelectorAll(
                ".resizeHandle"
            )
            .forEach(
                function (handle) {

                    handle.addEventListener(
                        "pointerdown",
                        function (event) {

                            if (!designMode) {
                                return;
                            }


                            event.preventDefault();

                            event.stopPropagation();


                            const target =
                                document.getElementById(
                                    handle.dataset.target
                                );


                            const currentScale =

                                target.id ===
                                "clockWidget"

                                    ? getClockScale()

                                    : getDateScale();


                            resizeState = {

                                target:
                                    target,

                                pointerId:
                                    event.pointerId,

                                startX:
                                    event.clientX,

                                startScale:
                                    currentScale

                            };


                            handle.setPointerCapture(
                                event.pointerId
                            );

                        }
                    );

                }
            );



        window.addEventListener(
            "pointermove",
            function (event) {

                if (!resizeState) {
                    return;
                }


                const delta =
                    event.clientX -
                    resizeState.startX;


                let newScale =

                    resizeState.startScale +

                    (
                        delta /
                        300
                    );


                newScale =
                    Math.max(
                        0.45,
                        Math.min(
                            2.5,
                            newScale
                        )
                    );


                if (
                    resizeState
                        .target
                        .id ===
                    "clockWidget"
                ) {

                    resizeState
                        .target
                        .style
                        .setProperty(
                            "--clock-scale",
                            newScale
                        );

                } else {

                    resizeState
                        .target
                        .style
                        .setProperty(
                            "--date-scale",
                            newScale
                        );

                }

            }
        );



        window.addEventListener(
            "pointerup",
            function () {

                if (
                    resizeState
                ) {

                    resizeState =
                        null;


                    saveLayout();

                }

            }
        );



        function getClockScale() {

            return parseFloat(

                getComputedStyle(
                    clockWidget
                )
                .getPropertyValue(
                    "--clock-scale"
                )

            ) || 1;

        }



        function getDateScale() {

            return parseFloat(

                getComputedStyle(
                    dateWidget
                )
                .getPropertyValue(
                    "--date-scale"
                )

            ) || 1;

        }



        /* ==================================
           SAVE LAYOUT
        ================================== */

        function saveLayout() {

            const layout = {

                clock: {

                    left:
                        clockWidget
                            .style
                            .left,

                    top:
                        clockWidget
                            .style
                            .top,

                    scale:
                        getClockScale()

                },

                date: {

                    left:
                        dateWidget
                            .style
                            .left,

                    top:
                        dateWidget
                            .style
                            .top,

                    scale:
                        getDateScale()

                }

            };


            localStorage.setItem(
                "videoClockLayout",
                JSON.stringify(
                    layout
                )
            );

        }



        function loadLayout() {

            const saved =
                localStorage.getItem(
                    "videoClockLayout"
                );


            if (!saved) {
                return;
            }


            try {

                const layout =
                    JSON.parse(
                        saved
                    );


                if (
                    layout.clock
                ) {

                    clockWidget
                        .style
                        .left =
                        layout.clock.left;


                    clockWidget
                        .style
                        .top =
                        layout.clock.top;


                    clockWidget
                        .style
                        .transform =
                        "scale(var(--clock-scale, 1))";


                    clockWidget
                        .style
                        .setProperty(
                            "--clock-scale",
                            layout.clock.scale || 1
                        );


                    clockWidget
                        .dataset
                        .positioned =
                        "true";

                }


                if (
                    layout.date
                ) {

                    dateWidget
                        .style
                        .left =
                        layout.date.left;


                    dateWidget
                        .style
                        .top =
                        layout.date.top;


                    dateWidget
                        .style
                        .right =
                        "auto";


                    dateWidget
                        .style
                        .bottom =
                        "auto";


                    dateWidget
                        .style
                        .transform =
                        "scale(var(--date-scale, 1))";


                    dateWidget
                        .style
                        .setProperty(
                            "--date-scale",
                            layout.date.scale || 1
                        );


                    dateWidget
                        .dataset
                        .positioned =
                        "true";

                }


            } catch (error) {

                console.log(
                    "Could not load saved layout."
                );

            }

        }



        /* ==================================
           RESET LAYOUT
        ================================== */

        resetLayoutButton.addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "videoClockLayout"
                );


                clockWidget.removeAttribute(
                    "style"
                );


                dateWidget.removeAttribute(
                    "style"
                );


                delete clockWidget
                    .dataset
                    .positioned;


                delete dateWidget
                    .dataset
                    .positioned;


                settingsPanel
                    .classList
                    .remove(
                        "show"
                    );

            }
        );



        /* ==================================
           LOAD SAVED POSITION
        ================================== */

        loadLayout();

    </script>


</body>

</html>
